<style>
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --sub: #8b949e;
    --red: #992828;
    --green: #2ea043;
    --amber: #d29922;
    --blue: #58a6ff;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; padding:20px; max-width:800px; margin:0 auto; }
  .header { text-align:center; padding:32px 0 24px; border-bottom:1px solid var(--border); margin-bottom:24px; }
  .header h1 { font-size:1.4rem; letter-spacing:1px; }
  .header p { color:var(--sub); font-size:0.8rem; margin-top:4px; }

  .tabs { display:flex; gap:4px; margin-bottom:24px; flex-wrap:wrap; }
  .tab { padding:8px 16px; border:1px solid var(--border); border-radius:8px; cursor:pointer; font-size:0.85rem; color:var(--sub); background:var(--card); transition:all .15s; }
  .tab:hover { border-color:var(--blue); color:var(--text); }
  .tab.active { background:var(--blue); color:#fff; border-color:var(--blue); font-weight:600; }
  .tab.match { border-color:var(--amber); }
  .tab.match.active { background:var(--amber); color:#000; border-color:var(--amber); }
  .tab.rest { border-color:var(--green); }
  .tab.rest.active { background:var(--green); color:#fff; border-color:var(--green); }

  .day-panel { display:none; }
  .day-panel.active { display:block; }

  .hero { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:24px; margin-bottom:16px; }
  .hero .date { font-size:1.1rem; font-weight:700; }
  .hero .type { display:inline-block; padding:2px 10px; border-radius:12px; font-size:0.75rem; margin-left:8px; font-weight:600; }
  .type-train { background:#1a3a2a; color:var(--green); }
  .type-match { background:#3a2f1a; color:var(--amber); }
  .type-rest { background:#1a2a3a; color:var(--blue); }

  .stats-row { display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin:16px 0; }
  .stat { text-align:center; }
  .stat .num { font-size:1.5rem; font-weight:700; }
  .stat .lbl { font-size:0.7rem; color:var(--sub); text-transform:uppercase; letter-spacing:0.5px; }
  .stat .num.green { color:var(--green); }
  .stat .num.amber { color:var(--amber); }
  .stat .num.red { color:var(--red); }

  .section { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:20px; margin-bottom:12px; }
  .section h3 { font-size:0.85rem; margin-bottom:12px; display:flex; align-items:center; gap:6px; }
  .section h3 .icon { font-size:1.1rem; }

  .player-list { list-style:none; }
  .player-list li { padding:6px 0; border-bottom:1px solid var(--border); font-size:0.85rem; display:flex; justify-content:space-between; align-items:center; }
  .player-list li:last-child { border-bottom:none; }
  .player-list .name { font-weight:600; }
  .player-list .rpe { font-size:0.75rem; padding:2px 8px; border-radius:10px; }
  .rpe-high { background:#3a1a1a; color:var(--red); }
  .rpe-mid { background:#3a2f1a; color:var(--amber); }
  .rpe-low { background:#1a3a2a; color:var(--green); }

  .tag { display:inline-block; padding:2px 8px; border-radius:10px; font-size:0.7rem; margin:2px; }
  .tag-issue { background:#3a1a1a; color:var(--red); }
  .tag-recover { background:#1a3a2a; color:var(--green); }
  .tag-info { background:#1a2a3a; color:var(--blue); }

  .advice { font-size:0.9rem; padding:12px 16px; border-radius:8px; margin-top:12px; }
  .advice-green { background:#1a3a2a; border:1px solid var(--green); }
  .advice-amber { background:#3a2f1a; border:1px solid var(--amber); }
  .advice-red { background:#3a1a1a; border:1px solid var(--red); }

  .footer { text-align:center; color:var(--sub); font-size:0.7rem; padding:32px 0 16px; }
  @media(max-width:600px){ .stats-row{grid-template-columns:repeat(3,1fr);} }
</style>
</head>

function avg(arr) { return arr.length ? (arr.reduce((a,b)=>a+b,0)/arr.length).toFixed(1) : '-'; }

function renderDay(sn) {
  const d = DATA[sn];
  const m = DAY_META[sn];
  const n = DAY_NOTES[sn];
  const typeClass = m.type === 'match' ? 'type-match' : m.type === 'rest' ? 'type-rest' : 'type-train';
  const nP = d.n_participants;

  let html = `<div class="hero">
    <span class="date">${m.date}</span>
    <span class="type ${typeClass}">${m.typeLabel}</span>
    <p style="color:var(--sub);margin-top:8px;font-size:0.85rem">${m.desc}</p>
    <div class="stats-row">
      <div class="stat"><div class="num">${nP}</div><div class="lbl">参训</div></div>
      <div class="stat"><div class="num ${d.total_srpe>8000?'red':d.total_srpe>5000?'amber':'green'}">${d.total_srpe}</div><div class="lbl">总sRPE</div></div>
      <div class="stat"><div class="num">${d.rpes.length?avg(d.rpes):'-'}</div><div class="lbl">均RPE</div></div>
      <div class="stat"><div class="num">${d.sleeps.length?avg(d.sleeps):'-'}</div><div class="lbl">睡眠</div></div>
      <div class="stat"><div class="num ${d.fatigues.length && avg(d.fatigues)>3.5?'amber':''}">${d.fatigues.length?avg(d.fatigues):'-'}</div><div class="lbl">疲劳</div></div>
    </div>
  </div>`;

  // Issues section
  const realIssues = n.issues.filter(i => !i.startsWith('全队'));
  if (realIssues.length > 0) {
    html += `<div class="section"><h3><span class="icon">⚠️</span> 需关注 (${realIssues.length}项)</h3><ul class="player-list">`;
    realIssues.forEach(i => {
      html += `<li>${i}</li>`;
    });
    html += `</ul></div>`;
  }

  // Good news
  if (n.good.length > 0) {
    html += `<div class="section"><h3><span class="icon">🟢</span> 好消息</h3><ul class="player-list">`;
    n.good.forEach(g => {
      html += `<li>▸ ${g}</li>`;
    });
    html += `</ul></div>`;
  }

  // Players with extreme values
  if (d.rpes.length > 0) {
    const players = (d.players || []).filter(p => p.rpe !== null);
    const topRPE = players.filter(p => p.rpe >= 8).sort((a,b)=>b.rpe-a.rpe);
    const lowRPE = players.filter(p => p.rpe !== null && p.rpe <= 2).sort((a,b)=>a.rpe-b.rpe);
    const highFatigue = players.filter(p => p.fatigue >= 4).sort((a,b)=>b.fatigue-a.fatigue);

    if (topRPE.length > 0 || highFatigue.length > 0) {
      html += `<div class="section"><h3><span class="icon">📊</span> 数据亮点</h3>`;
      if (topRPE.length > 0) html += `<div style="margin-bottom:8px"><span class="tag tag-issue">最高RPE</span> ${topRPE.map(p=>`${p.name}(${p.rpe})`).join(' ')}</div>`;
      if (lowRPE.length > 0) html += `<div style="margin-bottom:8px"><span class="tag tag-info">最低RPE</span> ${lowRPE.map(p=>`${p.name}(${p.rpe})`).join(' ')}</div>`;
      if (highFatigue.length > 0) html += `<div><span class="tag tag-issue">高疲劳</span> ${highFatigue.map(p=>`${p.name}(${p.fatigue}/5)`).join(' ')}</div>`;
      html += `</div>`;
    }
  }

  // Advice
  html += `<div class="advice ${n.adviceClass}">💡 <strong>明日建议：</strong>${n.advice}</div>`;

  return html;
}

// Build tabs and panels
const days = ['06','07','08','09','10','11','12','13','14','15','16','17','18'];
let tabsHtml = '', panelsHtml = '';

days.forEach((sn, i) => {
  const m = DAY_META[sn];
  const tabClass = m.type === 'match' ? 'tab match' : m.type === 'rest' ? 'tab rest' : 'tab';
  const active = i === days.length - 1 ? ' active' : '';
  tabsHtml += `<div class="${tabClass}${active}" onclick="switchDay('${sn}')">${m.date.split(' ')[0]}</div>`;
  panelsHtml += `<div class="day-panel${active}" id="panel-${sn}">${renderDay(sn)}</div>`;
});

document.getElementById('tabs').innerHTML = tabsHtml;
document.getElementById('panels').innerHTML = panelsHtml;

function switchDay(sn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.day-panel').forEach(p => p.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('panel-'+sn).classList.add('active');
}
</script>
</body>
</html>
