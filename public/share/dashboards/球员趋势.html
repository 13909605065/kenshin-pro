:root {

* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; padding:16px; max-width:900px; margin:0 auto; }
h1 { font-size:1.2rem; margin-bottom:4px; }
.subtitle { color:var(--sub); font-size:0.8rem; margin-bottom:16px; }

.chart-box { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:12px; }
.chart-box h3 { font-size:0.85rem; color:var(--sub); margin-bottom:8px; }
canvas { width:100% !important; height:200px !important; }
.stats { display:flex; gap:16px; flex-wrap:wrap; margin-bottom:16px; }
.stat { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:10px 16px; text-align:center; }
.stat .num { font-size:1.4rem; font-weight:700; }
.stat .lbl { font-size:0.7rem; color:var(--sub); }
.notes { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:12px; margin-top:12px; }
.notes h3 { font-size:0.85rem; color:var(--amber); margin-bottom:8px; }
.notes .note { padding:4px 0; border-bottom:1px solid var(--border); font-size:0.8rem; }
.notes .note:last-child { border-bottom:none; }

// 动态生成球员下拉（离队球员沉底）
const DEPARTED = ["王宇扬","栾家铭","高云鹏"];
const sel = document.getElementById('playerSelect');
const names = Object.keys(DATA).sort((a,b)=>{
  const da = DEPARTED.includes(a), db = DEPARTED.includes(b);
  return da===db ? a.localeCompare(b,'zh') : da-db;
});
sel.innerHTML = '<option value="">— 选择球员 —</option>' +
  names.map(n=>`<option value="${n}">${DEPARTED.includes(n)?n+'（已离队）':n}</option>`).join('');

let charts = [];
function mk(id, label, data, labels, color, max){
  const c = new Chart(document.getElementById(id), {
    type:'line',
    data:{labels, datasets:[{label, data, borderColor:color, backgroundColor:color+'33',
      tension:0.3, spanGaps:true, pointRadius:3}]},
    options:{plugins:{legend:{display:false}},
      scales:{y:{min:0, max, grid:{color:'#30363d'}, ticks:{color:'#8b949e'}},
              x:{grid:{color:'#30363d'}, ticks:{color:'#8b949e', maxRotation:60}}}}
  });
  charts.push(c);
}
function renderPlayer(){
  const name = sel.value;
  charts.forEach(c=>c.destroy()); charts=[];
  const stats = document.getElementById('stats'), notes = document.getElementById('notes');
  if(!name){ stats.innerHTML=''; notes.innerHTML=''; return; }
  const rows = DATA[name];
  const labels = rows.map(r=>r.date.slice(5).replace('-','/'));
  mk('chartSleep','睡眠', rows.map(r=>r.sleep), labels, '#58a6ff', 5);
  mk('chartFatigue','疲劳', rows.map(r=>r.fatigue), labels, '#d29922', 5);
  mk('chartSoreness','酸痛', rows.map(r=>r.soreness), labels, '#992828', 5);
  mk('chartRPE','RPE', rows.map(r=>r.rpe), labels, '#2ea043', 10);
  const last = rows[rows.length-1];
  const srpe7 = rows.slice(-7).reduce((a,r)=>a+(r.srpe||0),0);
  stats.innerHTML = `
    <div class="stat"><div class="num">${last.sleep ?? '-'}</div><div class="lbl">最新睡眠</div></div>
    <div class="stat"><div class="num">${last.fatigue ?? '-'}</div><div class="lbl">最新疲劳</div></div>
    <div class="stat"><div class="num">${last.soreness ?? '-'}</div><div class="lbl">最新酸痛</div></div>
    <div class="stat"><div class="num">${srpe7}</div><div class="lbl">近7天sRPE</div></div>
    <div class="stat"><div class="num">${rows.length}</div><div class="lbl">记录天数</div></div>`;
  const noted = rows.filter(r=>r.note && r.note !== '正常' && r.note !== '');
  notes.innerHTML = '<h3>📝 备注记录</h3>' + (noted.length
    ? noted.map(r=>`<div class="note"><strong>${r.date.slice(5)}</strong> ${r.note}</div>`).join('')
    : '<div class="note">无备注</div>');
}
