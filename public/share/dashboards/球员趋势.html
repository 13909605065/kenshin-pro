:root {

  --amber: #d29922; --blue: #58a6ff;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; padding:16px; max-width:900px; margin:0 auto; }
h1 { font-size:1.2rem; margin-bottom:4px; }
.subtitle { color:var(--sub); font-size:0.8rem; margin-bottom:16px; }
select { width:100%; padding:10px; background:var(--card); color:var(--text); border:1px solid var(--border); border-radius:8px; font-size:1rem; margin-bottom:16px; }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
@media (max-width:600px) { .grid { grid-template-columns:1fr; } }
.chart-box { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:12px; }
.chart-box h3 { font-size:0.85rem; color:var(--sub); margin-bottom:8px; }
canvas { width:100% !important; height:200px !important; }
.stats { display:flex; gap:16px; flex-wrap:wrap; margin-bottom:16px; }
.stat { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:10px 16px; text-align:center; }
.stat .num { font-size:1.4rem; font-weight:700; }
.stat .lbl { font-size:0.7rem; color:var(--sub); }
.notes { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:12px; margin-top:12px; }
.notes h3 { font-size:0.85rem; color:var(--amber); margin-bottom:8px; }
.notes .note { padding:4px 0; border-bottom:1px solid var(--border); font-size:0.8rem; }
.notes .note:last-child { border-bottom:none; }
</style>

  const latest = d[d.length-1];
  const avg = arr => arr.length ? (arr.reduce((a,b)=>a+b,0)/arr.length).toFixed(1) : '-';
  const sleeps = d.filter(x=>x.sleep!=null).map(x=>x.sleep);
  const fatigues = d.filter(x=>x.fatigue!=null).map(x=>x.fatigue);
  const sorenesses = d.filter(x=>x.soreness!=null).map(x=>x.soreness);
  const rpes = d.filter(x=>x.rpe!=null).map(x=>x.rpe);

  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="num">${d.length}</div><div class="lbl">数据天数</div></div>
    <div class="stat"><div class="num">${latest.sleep||'-'}</div><div class="lbl">最新睡眠</div></div>
    <div class="stat"><div class="num">${latest.fatigue||'-'}</div><div class="lbl">最新疲劳</div></div>
    <div class="stat"><div class="num">${latest.soreness||'-'}</div><div class="lbl">最新酸痛</div></div>
    <div class="stat"><div class="num">${avg(sleeps)}</div><div class="lbl">均睡眠</div></div>
    <div class="stat"><div class="num">${avg(fatigues)}</div><div class="lbl">均疲劳</div></div>
    <div class="stat"><div class="num">${avg(sorenesses)}</div><div class="lbl">均酸痛</div></div>
    <div class="stat"><div class="num">${avg(rpes)}</div><div class="lbl">均RPE</div></div>
  `;

  destroyCharts();

  const labels = DATES.map(x => x.slice(5)); // MM-DD
  const getData = (field) => DATES.map(date => {
    const entry = d.find(x => x.date === date);
    return entry ? entry[field] : null;
  });

  const chartOpts = (label, color, max) => ({
    type: 'line',
    data: {
      labels,
      datasets: [{
        label, data: getData(label === 'RPE' ? 'rpe' : label === '睡眠' ? 'sleep' : label === '疲劳' ? 'fatigue' : 'soreness'),
        borderColor: color, backgroundColor: color + '20',
        fill: true, tension: 0.3, pointRadius: 3, pointHoverRadius: 5,
        spanGaps: false,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        y: { min: 1, max, ticks: { stepSize: 1, color: '#8b949e' }, grid: { color: '#30363d' } },
        x: { ticks: { color: '#8b949e', maxTicksLimit: 8, autoSkip: true }, grid: { display: false } }
      }
    }
  });

  charts.sleep = new Chart(document.getElementById('chartSleep'), chartOpts('睡眠', '#58a6ff', 5));
  charts.fatigue = new Chart(document.getElementById('chartFatigue'), chartOpts('疲劳', '#d29922', 5));
  charts.sore = new Chart(document.getElementById('chartSoreness'), chartOpts('酸痛', '#992828', 5));
  charts.rpe = new Chart(document.getElementById('chartRPE'), chartOpts('RPE', '#2ea043', 10));

  // Notes
  const notesHtml = d.filter(x => x.note && x.note !== 'None' && x.note.trim()).reverse().slice(0,10)
    .map(x => `<div class="note"><strong>${x.date.slice(5)}</strong> ${x.note}</div>`).join('');
  document.getElementById('notes').innerHTML = notesHtml ? '<h3>📝 近期备注</h3>' + notesHtml : '';
}

// Auto-select last viewed or first player
const last = localStorage.getItem('trend_player');
if (last && DATA[last]) {
  document.getElementById('playerSelect').value = last;
  renderPlayer();
}
document.getElementById('playerSelect').addEventListener('change', function() {
  localStorage.setItem('trend_player', this.value);
});
</script>
</body>
</html>
