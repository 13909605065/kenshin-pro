<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>崇德荣海 · 负荷监控</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#0f1419;--card:#1a1f2e;--text:#e1e4e8;--sub:#8b949e;--red:#992828;--green:#2ea043;--amber:#d29922;--blue:#58a6ff;--border:#30363d}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:20px}
h1{font-size:1.4rem;margin-bottom:4px}
.sub{color:var(--sub);font-size:0.8rem;margin-bottom:20px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px}
.card .l{color:var(--sub);font-size:0.7rem;text-transform:uppercase}
.card .v{font-size:1.6rem;font-weight:700;margin:4px 0}
.card .c{font-size:0.7rem;color:var(--sub)}
.row{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-bottom:14px}
.box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px}
.box h2{font-size:0.9rem;margin-bottom:10px;color:var(--sub)}
.wrap{position:relative;height:270px}.wrap.s{height:230px}
@media(max-width:768px){.row{grid-template-columns:1fr}} 
</style></head><body>
<h1>⚽ 山西崇德荣海 · 负荷监控</h1>
<p class="sub">7/6 — 8/8 · 33天 · 自动生成</p>
<div class="cards">
<div class="card"><div class="l">📊 最新sRPE</div><div class="v" id="v0">—</div><div class="c" id="t0">—</div></div>
<div class="card"><div class="l">📈 7日均sRPE</div><div class="v" id="v1">—</div><div class="c">近7训练日</div></div>
<div class="card"><div class="l">😴 睡眠</div><div class="v" id="v2">—</div><div class="c">1最好·5最差</div></div>
<div class="card"><div class="l">💪 疲劳</div><div class="v" id="v3">—</div><div class="c">1最低·5最高</div></div>
<div class="card"><div class="l">🦵 酸痛</div><div class="v" id="v4">—</div><div class="c">1无·5剧痛</div></div>
</div>
<div class="row">
<div class="box"><h2>📊 每日训练负荷 (sRPE)</h2><div class="wrap"><canvas id="c1"></canvas></div></div>
<div class="box"><h2>🫀 身体状态趋势</h2><div class="wrap"><canvas id="c2"></canvas></div></div>
</div>
<div class="row">
<div class="box"><h2>📈 均RPE + 参训人数</h2><div class="wrap s"><canvas id="c3"></canvas></div></div>
</div>

const days=Object.keys(raw).sort((a,b)=>{const A=a.split('.'),B=b.split('.');return(parseInt(A[0])*100+(parseInt(A[1])||0))-(parseInt(B[0])*100+(parseInt(B[1])||0))});
const L=days.map(d=>raw[d].date),S=days.map(d=>raw[d].total_srpe),R=days.map(d=>raw[d].avg_rpe);

const last=raw[days[days.length-1]];
document.getElementById('v0').textContent=last.total_srpe.toLocaleString();
